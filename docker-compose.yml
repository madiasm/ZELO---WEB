services:
  database:
    build: ./database
    container_name: zelo_database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - zelo_dados:/var/lib/postgresql/data
    networks:
      - zelo_rede
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: zelo_backend
    restart: unless-stopped
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - zelo_rede

  frontend:
    build: ./frontend
    container_name: zelo_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - zelo_rede

volumes:
  zelo_dados:

networks:
  zelo_rede:
